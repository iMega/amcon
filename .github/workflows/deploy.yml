name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          STATICFORM: ${{ secrets.STATICFORM }}
        run: npm run build
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id ~/.ssh/known_hosts
          printf 'Host ali\n  HostName 162.0.235.12\n  Port 21098\n  User alimpury\n  IdentityFile ~/.ssh/id\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - name: Upload
        run: rsync -az --delete --exclude=.well-known --exclude=cgi-bin dist/ ali:public_html/
      - name: Server setup
        run: ssh ali 'bash -s' < scripts/server-setup.sh
